d" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1040" y="126" width="172" height="190" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="1126.0" y="216.0" font-size="23" font-weight="600" fill="#172b42" text-anchor="middle">Host</text><text x="1126.0" y="239.0" font-size="23" font-weight="600" fill="#172b42" text-anchor="middle">system</text><rect x="650" y="248" width="211" height="68" rx="12" fill="white" stroke="#7441b0" stroke-width="1.5"/><text x="755.5" y="277.0" font-size="18" font-weight="600" fill="#172b42" text-anchor="middle">Physical</text><text x="755.5" y="300.0" font-size="18" font-weight="600" fill="#172b42" text-anchor="middle">disturbance</text><path d="M 861 282 H 1040" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="893" y="267" font-size="14" font-weight="400" fill="#526477" text-anchor="start">physical input</text><text x="642" y="369" font-size="13.5" font-weight="400" fill="#526477" text-anchor="start">Conceptual paths · choose an appropriate interface</text>
