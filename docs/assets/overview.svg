<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">AnomalyLibrary</title>
<desc id="desc">One path modifies a signal or message inline before it enters a host system. A separate path applies a physical disturbance through a suitable physical input.</desc>
